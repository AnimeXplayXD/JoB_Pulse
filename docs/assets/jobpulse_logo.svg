<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="100%" height="120" fill="none">
    <defs>
        <!-- Luminous Saffron Glow -->
        <linearGradient id="jp-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD166" />
            <stop offset="50%" stop-color="#FF9933" />
            <stop offset="100%" stop-color="#F4A261" />
        </linearGradient>

        <!-- Pure Specular White Gradient -->
        <linearGradient id="jp-white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E2E8F0" />
        </linearGradient>

        <!-- Ambient Glow Filter for Apple-grade Bloom -->
        <filter id="jp-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Glass Badge Shadow -->
        <filter id="jp-badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
        </filter>
    </defs>

    <!-- App Icon Emblem Squircle (Apple 22.5% radius) -->
    <g transform="translate(16, 12)" filter="url(#jp-badge-shadow)">
        <!-- Squircle Background -->
        <rect x="0" y="0" width="96" height="96" rx="22" ry="22" fill="#070E22" stroke="#1E3A70" stroke-width="1.2" />
        <!-- Radial Ambient Glow -->
        <circle cx="48" cy="48" r="38" fill="#0D224C" opacity="0.8" />
        <circle cx="48" cy="48" r="24" fill="#132F67" opacity="0.6" />
        <circle cx="48" cy="48" r="12" fill="#1A3C7E" opacity="0.5" />

        <!-- Top Rim Specular Highlight (Liquid Glass) -->
        <path d="M 12 12 Q 48 2 84 12 Q 48 18 12 12 Z" fill="#FFFFFF" opacity="0.18" />

        <!-- Monogram Scale: mapped to 96x96 box (center 48, 48, scale ~0.88) -->
        <g transform="translate(0.5, 0.5)">
            <!-- J Letterform -->
            <path d="M 35.6 26.7 L 35.6 56.9 C 35.6 65.8 23.1 65.8 23.1 56.9 L 23.1 51.6" 
                  stroke="url(#jp-white-grad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />

            <!-- P Letterform -->
            <path d="M 48.0 26.7 L 48.0 67.6 M 48.0 26.7 L 58.7 26.7 C 67.6 26.7 67.6 46.2 58.7 46.2 L 48.0 46.2" 
                  stroke="url(#jp-white-grad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Pulse Signal Waveform with Bloom -->
            <path d="M 21.3 46.2 L 30.2 46.2 L 35.6 54.2 L 44.4 32.9 L 51.6 57.8 L 58.7 46.2 L 65.8 46.2" 
                  stroke="url(#jp-gold-grad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#jp-glow)" />

            <!-- Radiant Saffron Beacon Node -->
            <circle cx="72.4" cy="46.2" r="3.2" fill="#FF9933" filter="url(#jp-glow)" />
        </g>
    </g>

    <!-- Typographic Wordmark -->
    <g transform="translate(132, 70)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#FFFFFF">Job</text>
        <text x="76" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8" fill="url(#jp-white-grad)">Pulse</text>
        <!-- Luminous Beacon Dot -->
        <circle cx="198" cy="-8" r="5" fill="url(#jp-gold-grad)" filter="url(#jp-glow)" />

        <!-- Apple-grade Subtitle / Category Label -->
        <text x="3" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2.8" fill="#94A3B8" text-transform="uppercase">Recruitment Intelligence Engine</text>
    </g>

    <!-- Liquid Glass Version Tag Pill -->
    <g transform="translate(420, 42)">
        <rect x="0" y="0" width="108" height="28" rx="14" ry="14" fill="#0D224C" fill-opacity="0.45" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="0.8" />
        <circle cx="14" cy="14" r="3.5" fill="#38BDF8" />
        <text x="25" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.8" fill="#E0F2FE">v1.2 PRO</text>
    </g>
</svg>
