name: Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release Title'
        required: false
        default: 'JobPulse v1.0.0'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Generate development Google Services configuration if missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.aistudio.govtjobs.pxrtwa"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
          fi

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK release artifacts
        run: |
          mkdir -p release-apks
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          # Find and copy debug APK
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "release-apks/JobPulse-${TAG}-debug.apk"
          fi
          # Find and copy release APK (signed or unsigned)
          for f in app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then
              base=$(basename "$f" .apk)
              cp "$f" "release-apks/JobPulse-${TAG}-${base}.apk"
            fi
          done
          ls -lah release-apks/

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jobpulse-apks
          path: release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          files: release-apks/*.apk
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### JobPulse Android Release 🎉
            
            Download the ready-to-install APK below:
            - **Debug APK** (`JobPulse-*-debug.apk`): Ready for immediate testing and side-loading on any Android device without signing configuration.
            - **Release APK** (`JobPulse-*-release*.apk`): Production-optimized and ProGuard/R8 minified build.
            
            #### Installation instructions:
            1. Download the `.apk` file to your Android phone.
            2. Open the file and allow "Install from Unknown Sources" if prompted.
            3. Enjoy JobPulse!
